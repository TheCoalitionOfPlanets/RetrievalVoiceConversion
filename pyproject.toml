[project]
name = "rvc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PRIEYAN", email = "mnprieyan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
