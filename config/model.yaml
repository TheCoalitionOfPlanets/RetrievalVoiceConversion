# RVC v2 synthesizer configuration (32 kHz profile).
#
# 32 kHz is chosen over 40/48 kHz because the decoder upsampling stack and
# discriminator dominate VRAM; 32k keeps a full GAN step inside ~4 GB.

sample_rate: 32000

audio:
  sample_rate: 32000
  hubert_sample_rate: 16000
  filter_length: 1024
  hop_length: 320
  win_length: 1024
  n_mel_channels: 80
  mel_fmin: 0.0
  mel_fmax: null

hubert:
  model_name: lengyue233/content-vec-best
  output_layer: 12
  embedding_dim: 768

pitch:
  method: harvest
  sample_rate: 16000
  hop_length: 160
  f0_min: 50.0
  f0_max: 1100.0
  f0_bin: 256

generator:
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.0
  resblock: "1"
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  upsample_rates: [10, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  spk_embed_dim: 109
  gin_channels: 256

discriminator:
  periods: [2, 3, 5, 7, 11, 17]
  use_spectral_norm: false
