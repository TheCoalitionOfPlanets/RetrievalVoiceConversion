# Training configuration tuned for a single 4 GB GPU (RTX 3050 Laptop).
# Raise batch_size / segment_size if you move to a larger card.

seed: 1234

data:
  processed_dir: data/processed
  filelist: data/processed/filelist.txt
  min_frames: 60            # ~0.6 s — shorter clips carry too little content
  max_frames: 500           # ~5 s — caps the O(T^2) attention cost at ~2.9 GB

training:
  epochs: 300
  batch_size: 4
  segment_size: 12800        # samples -> 40 frames at hop 320
  learning_rate: 0.0001
  betas: [0.8, 0.99]
  eps: 1.0e-9
  lr_decay: 0.999875
  fp16: true
  max_grad_norm: null
  num_workers: 2

loss:
  c_mel: 45.0
  c_kl: 1.0

checkpoint:
  dir: data/checkpoints
  save_every_epoch: 5
  keep_last: 3
  # Official RVC v2 32k base models — load these unless you have 10+ hours of
  # audio. They make ~30 min of a single speaker enough. Fetch with:
  #   hf download lj1995/VoiceConversionWebUI pretrained_v2/f0G32k.pth \
  #     pretrained_v2/f0D32k.pth --local-dir data/pretrained
  pretrained_g: data/pretrained/pretrained_v2/f0G32k.pth
  pretrained_d: data/pretrained/pretrained_v2/f0D32k.pth

logging:
  log_dir: data/logs
  log_every_steps: 50
  eval_every_epoch: 10
